<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- GOOGLE FONTS - ROBOTO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JAVASCRIPT -->
    <script src="/scripts/script.js" defer></script>

    <title>Formulário</title>
</head>
<body>
    <div class="container-main">
        <header class="header">
            <div>
                <h1>Criar Conta</h1>
                <span class="line"></span>
            </div>
            <div class="conter-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
        </header>
        <form class="form">
            <div class="conter-input">
                <label for="firstName">Primeiro Nome</label>
                <input type="text" class="form-input" placeholder="Fulano" name="name" id="firstName">
                <p class="error" id="v-fname"></p>
            </div>
            <div class="conter-input">
                <label for="lastName">Último Nome</label>
                <input type="text" class="form-input" placeholder="De tal" name="LName" id="lastName">
                <p class="error" id="v-flast"></p>
            </div>
            <div class="conter-input">
                <label for="birthday">Nascimento</label>
                <input type="date" class="form-input" name="birthdayIn" id="birthday">
                <p class="error" id="v-birth"></p>
            </div>
            <div class="conter-input">
                <label for="email">E-Mail</label>
                <input type="email" class="form-input" placeholder="exemplo@gmail.com" name="mail" id="email">
                <p class="error" id="v-mail"></p>
            </div>
            <div class="conter-input">
                <label for="password">Senha</label>
                <input type="password" class="form-input" name="pass" id="password">
                <p class="error" id="v-pass"></p>
            </div>
            <div class="conter-input">
                <label for="rpassword">Confirmar Senha</label>
                <input type="password" class="form-input" name="repass" id="rpassword">
                <p class="error" id="v-rpass"></p>
            </div>

            <div>
                <p>Gênero</p>
                <div class="conter-check">
                    <div>
                        <input type="radio" class="check" id="Feminino">
                        <label for="Feminino">Feminino</label>
                    </div>
                    <div>
                        <input type="radio" class="check" id="Masculino">
                        <label for="Masculino">Masculino</label>
                    </div>
                    <div>
                        <input type="radio" class="check" id="Outro">
                        <label for="Outro">Outro</label>
                    </div>
                    <p class="error"></p>
                </div>
            </div>
        </form>
        <footer class="footer">
            <button class="btn-create" id="btn">Criar Conta</button>
        </footer>
    </div>
</body>
</html>
